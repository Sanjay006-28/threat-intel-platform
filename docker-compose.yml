version: "3.8"

services:
  sentinel-tip:
    build: .
    container_name: sentinel-tip
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./threat_intel.db
      - DEV_AUTO_LOGIN=False
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme123}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey-sentinel-cti-platform}
      - AUTO_INGEST_DIR=./auto_ingest
      - IOC_TTL_DAYS=30
      - SCHEDULER_INTERVAL_MINUTES=360
    volumes:
      - ./:/app
      - ./auto_ingest:/app/auto_ingest
    restart: unless-stopped
