<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SENTINEL Threat Intel Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow bg-dark text-white border-secondary">
                    <div class="card-body p-4">
                        <h4 class="card-title text-center mb-4 fw-bold">🛡️ SENTINEL CTI</h4>
                        <p class="text-secondary small text-center mb-4 font-mono">Cyber Threat Intelligence Console</p>
                        {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                        <form method="post" action="/login">
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Username</label>
                                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Password</label>
                                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign In to SENTINEL</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="/register" class="text-decoration-none text-info small">Need an account? Register here</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
