<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SENTINEL Threat Intel Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow bg-dark text-white border-secondary p-4" style="width: 400px;">
        <h4 class="text-center mb-1 fw-bold">🛡️ SENTINEL CTI</h4>
        <p class="text-secondary small text-center mb-4 font-mono">Analyst Registration</p>
        
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        
        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label text-secondary small">Username</label>
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary small">Password (Min. 8 characters)</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold">Create Analyst Account</button>
        </form>
        <div class="text-center mt-3">
            <a href="/login" class="text-decoration-none text-info small">Already have an account? Login here</a>
        </div>
    </div>
</div>
</body>
</html>
