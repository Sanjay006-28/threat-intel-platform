<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - SENTINEL SOC Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card-custom {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
        }
        .form-control {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #f3f4f6;
        }
        .form-control:focus {
            background-color: #1f2937;
            border-color: #3b82f6;
            color: #f3f4f6;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-custom shadow-lg p-3">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-white mb-1"><i class="bi bi-shield-lock-fill text-danger me-2"></i>Security Action Required</h3>
                            <p class="text-secondary small mb-0">SENTINEL SOC - Account Security Policy</p>
                        </div>

                        {% if is_forced %}
                        <div class="alert alert-warning border-0 small mb-3">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>
                            <strong>Default Password Detected:</strong> The system administrator must change the default password (<code>changeme123</code>) before accessing the platform.
                        </div>
                        {% endif %}

                        {% if error %}
                        <div class="alert alert-danger border-0 small mb-3">
                            <i class="bi bi-x-circle-fill me-1"></i> {{ error }}
                        </div>
                        {% endif %}

                        <form method="post" action="/change-password">
                            <div class="mb-3">
                                <label class="form-label small text-secondary">Logged in as</label>
                                <input type="text" class="form-control form-control-sm text-muted" value="{{ username }}" disabled>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-secondary">Current Password</label>
                                <input type="password" name="current_password" class="form-control form-control-sm" required autofocus placeholder="Enter current password">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-secondary">New Password (min 8 chars)</label>
                                <input type="password" name="new_password" class="form-control form-control-sm" required placeholder="Choose a strong password">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-secondary">Confirm New Password</label>
                                <input type="password" name="confirm_password" class="form-control form-control-sm" required placeholder="Repeat new password">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                                <i class="bi bi-check2-circle me-1"></i> Update Password & Proceed
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <a href="/logout" class="text-secondary small text-decoration-none">
                                <i class="bi bi-box-arrow-right me-1"></i> Log out
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
